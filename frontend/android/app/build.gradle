apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'   // Firebase‑Google‑Services plugin

android {
    namespace "com.bullrealboss.crm"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.bullrealboss.crm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1          // Play Store’da yeni sürüm için artırın
        versionName "1.0"      // Görünen sürüm
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // **ÖNEMLİ:** Release keystore dosyasını (release.keystore) projenizin
            //  `android/app/` klasörüne koyun ve aşağıdaki env‑değişkenlerini
            //  CI/CD ortamına (GitHub Secrets) ekleyin.
            storeFile file('release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'release'
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // AAB (Android App Bundle) üretmek için gerekli
    bundle {
        language {
            enableSplit = false   // Tek paket, tüm diller
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.core:core-ktx:+"
    implementation "androidx.appcompat:appcompat:+"
    implementation "com.google.android.material:material:+"
    implementation "androidx.constraintlayout:constraintlayout:+"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:+"
    implementation "androidx.activity:activity-compose:+"
    testImplementation "junit:junit:+"
    androidTestImplementation "androidx.test.ext:junit:+"
    androidTestImplementation "androidx.test.espresso:espresso-core:+"
}
